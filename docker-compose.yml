services:
  dashboard:
    build: .
    container_name: health_dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - .:/app
      # Garmin-Session-Token dauerhaft auf dem Host persistieren (bisher nur in der
      # Container-Schicht, ging bei Neuerstellung verloren) - und mit dashboard-v2 teilen, damit
      # dessen Auto-Sync (siehe auto_sync.py) keinen eigenen zweiten Passwort-Login braucht.
      - ./garmin_tokens:/root/.garminconnect
      # Withings-OAuth2-Token (siehe withings_auth.py) - auch mit dashboard-v2 geteilt (dort gibt es
      # inzwischen ebenfalls einen manuellen Withings-Sync auf der Einstellungsseite, siehe
      # backend/routers/data_sync.py), damit die einmalige interaktive Autorisierung
      # (examples/withings_authorize.py) für beide Services reicht.
      - ./withings_tokens:/root/.withings_api
    environment:
      - PYTHONUNBUFFERED=1
      # Ohne das läuft der Container in UTC (Debian-Basisimage-Default) - jeder datetime.now()-
      # Aufruf im ganzen Backend (Zeitstempel in Sync-Verlauf, Journal, Insight-Timestamps, ...)
      # wäre dann 1-2h (je nach Sommer-/Winterzeit) hinter der echten lokalen Zeit zurück. Europe/
      # Berlin statt eines festen Offsets, damit die Sommerzeit-Umstellung automatisch stimmt.
      - TZ=Europe/Berlin
    restart: unless-stopped

  # Schritt 1 des FastAPI+React-Rebuilds (siehe PROJECT_OVERVIEW.md) - läuft parallel zum
  # bestehenden Streamlit-Service, teilt sich nur die SQLite-Datei über ./data sowie den
  # Garmin-/Withings-Token-Cache über ./garmin_tokens und ./withings_tokens, sonst komplett
  # unabhängig (eigenes Image, eigener Port).
  dashboard-v2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: health_dashboard_v2
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./garmin_tokens:/root/.garminconnect
      - ./withings_tokens:/root/.withings_api
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
    restart: unless-stopped