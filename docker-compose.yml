services:
  dashboard:
    build: .
    container_name: health_dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - .:/app
      # Garmin-Session-Token dauerhaft auf dem Host persistieren (bisher nur in der
      # Container-Schicht, ging bei Neuerstellung verloren) - und mit dashboard-v2 teilen, damit
      # dessen Auto-Sync (siehe auto_sync.py) keinen eigenen zweiten Passwort-Login braucht.
      - ./garmin_tokens:/root/.garminconnect
      # Withings-OAuth2-Token (siehe withings_auth.py) - nur hier gemountet, der manuelle
      # Withings-Sync-Button läuft ausschließlich im Streamlit-Service, noch nicht in dashboard-v2.
      - ./withings_tokens:/root/.withings_api
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # Schritt 1 des FastAPI+React-Rebuilds (siehe PROJECT_OVERVIEW.md) - läuft parallel zum
  # bestehenden Streamlit-Service, teilt sich nur die SQLite-Datei über ./data und den
  # Garmin-Token-Cache über ./garmin_tokens, sonst komplett unabhängig (eigenes Image, eigener Port).
  dashboard-v2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: health_dashboard_v2
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./garmin_tokens:/root/.garminconnect
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped